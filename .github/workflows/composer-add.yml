name: composer-add

# 一次性工作流程：把 larastan/larastan 加進 require-dev 並提交 composer.json 與 lock。
on:
  push:
    paths: ['.github/workflows/composer-add.yml']

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer require --dev larastan/larastan:^3.0 --no-interaction --no-progress
      - name: Commit composer files
        run: |
          git config user.name "carbon-bot"
          git config user.email "carbon-bot@users.noreply.github.com"
          git add composer.json composer.lock
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: 加入 larastan/larastan 並更新 composer.lock"
          git push
