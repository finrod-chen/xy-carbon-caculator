name: composer-add

# 一次性工作流程：在雲端加入 Composer 套件（開發環境無法執行 composer）。
# 執行後會把 composer.json 與 composer.lock 的變更提交回觸發分支。

on:
  push:
    paths: ['.github/workflows/composer-add.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  require:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, sqlite3, pdo_sqlite
          coverage: none
      - name: Require packages
        run: composer require league/commonmark:^2.5 --no-interaction --no-progress
      - name: Show resulting versions
        run: |
          php artisan --version
          php -r "echo json_encode(json_decode(file_get_contents('composer.json'), true)['require'], JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES);"
      - name: Commit composer changes
        run: |
          git config user.name "carbon-composer"
          git config user.email "carbon-composer@users.noreply.github.com"
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git add composer.json composer.lock
          git commit -m "build: 加入 league/commonmark（說明頁 Markdown 渲染）"
          git push

