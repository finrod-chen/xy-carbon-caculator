name: bootstrap-laravel

# WP0.1：在 CI 上建立 Laravel 專案骨架並提交回 phase0-foundation 分支。
# 開發環境沒有 composer 執行權限，因此骨架由 GitHub Actions 產生，
# 產生的版本資訊會寫進 job log 與 README。

on:
  push:
    branches: [phase0-foundation]
    paths: ['.github/workflows/bootstrap-laravel.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, zip, fileinfo, bcmath
          coverage: none

      - name: Show toolchain versions
        run: php -v && composer --version

      - name: Create Laravel project
        run: |
          composer create-project laravel/laravel:^12.0 /tmp/laravel --no-interaction --prefer-dist
          php /tmp/laravel/artisan --version

      - name: Copy skeleton into repository
        run: |
          rsync -a --exclude '.git' --exclude 'docs' --exclude '.github' --exclude 'README.md' /tmp/laravel/ ./

      - name: Commit and push
        run: |
          git config user.name "carbon-bootstrap"
          git config user.email "carbon-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "WP0.1: 以 Laravel 12 建立專案骨架（CI 產生）"
          git push origin HEAD:phase0-foundation
