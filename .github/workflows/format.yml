name: format
# 觸發紀錄：2026-11-13T01:06:25.687Z

# 需要在雲端執行 Pint 自動排版時：編輯本檔任一註解即可觸發，
# 或手動 dispatch（需先讓本檔存在於預設分支）。把修正提交回觸發分支。

on:
  push:
    paths: ['.github/workflows/format.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: ./vendor/bin/pint
      - name: Commit formatting fixes
        run: |
          git config user.name "carbon-format"
          git config user.email "carbon-format@users.noreply.github.com"
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git add -A
          git commit -m "style: 以 Pint 自動排版"
          git push
