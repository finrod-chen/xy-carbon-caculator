name: format

# 在雲端執行 Pint 自動排版並把修正提交回觸發分支。
# 觸發方式：修改本檔任一註解後推送，或手動 workflow_dispatch。

on:
  push:
    paths: ['.github/workflows/format.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: ./vendor/bin/pint
      - name: Commit formatting fixes
        run: |
          git config user.name "carbon-format"
          git config user.email "carbon-format@users.noreply.github.com"
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git add -A
          git commit -m "style: 以 Pint 自動排版"
          git push

